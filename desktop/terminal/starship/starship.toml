format = """
[╭─](green)$username$hostname$directory$git_branch$git_status$docker_context$container
[╰─](green)$character
"""

add_newline = true

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
style = "bold green"
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = "🌱 "
style = "bold green"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bright-green"

untracked = "[?](bold yellow)"
modified = "[!](bold green)"
staged = "[+](bold green)"
renamed = "[»](bold green)"
deleted = "[✘](bold green)"
ahead = "[⇡](bold green)"
behind = "[⇣](bold green)"
diverged = "[⇕](bold yellow)"

[username]
style_user = "bold green"
show_always = false

[hostname]
ssh_only = true
ssh_symbol = "󰣀 "
style = "bold #99ff99"
format = "[$ssh_symbol$hostname]($style) "

[docker_context]
symbol = " "
style = "bold #66ff66"
format = "via [$symbol$context]($style) "

[container]
symbol = "⬢ "
style = "bold #99ff99"
format = "inside [$symbol$name]($style) "
